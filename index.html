<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | AdminExpress</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <main class="login">

    <section class="login__brand">
      <h1>AdminExpress</h1>
    </section>

    <section class="login__panel">
      <form class="form" action="#" method="post">

        <h2 class="form__title">Let's <strong>Sign In</strong> 👇</h2>
        <p class="form__text">Hey, Enter your details to get sign in to your account.</p>

        <label class="form__label" for="email">Email</label>
        <div class="field">
          <svg class="field__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="3" y="5" width="18" height="14" rx="2"></rect>
            <path d="M3 7l9 6 9-6"></path>
          </svg>
          <input type="email" id="email" name="email" placeholder="Enter Email" required>
        </div>

        <label class="form__label" for="password">Password</label>
        <div class="field">
          <svg class="field__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="5" y="11" width="14" height="9" rx="2"></rect>
            <path d="M8 11V8a4 4 0 0 1 8 0v3"></path>
          </svg>
          <input type="password" id="password" name="password" placeholder="Enter Password" required>
          <svg class="field__icon field__icon--eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M3 3l18 18"></path>
            <path d="M10.6 6.2A9.8 9.8 0 0 1 12 6c5 0 8.5 4 9.5 6a14 14 0 0 1-2.6 3.3"></path>
            <path d="M6.1 7.6C4.3 9 3 10.9 2.5 12c1 2 4.5 6 9.5 6 1.4 0 2.6-.3 3.7-.8"></path>
          </svg>
        </div>

        <a class="form__forgot" href="#">Forgot password?</a>

        <button class="btn" type="submit">Sign In</button>

        <p class="form__signup">Don't have an account? <a href="#">Sign Up</a></p>

      </form>
    </section>

  </main>

</body>
</html>
